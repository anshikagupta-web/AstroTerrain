services:
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:15-3.3}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astroterrain}
      POSTGRES_USER: ${POSTGRES_USER:-astroterrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astroterrain_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - astroterrain_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: AstroTerrain API
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-astroterrain}:${POSTGRES_PASSWORD:-astroterrain_dev_password}@db:5432/${POSTGRES_DB:-astroterrain}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  astroterrain_postgres_data:
