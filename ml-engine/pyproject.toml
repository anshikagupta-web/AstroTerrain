[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astroterrain-ml-engine"
version = "0.1.0"
description = "AstroTerrain ML Engine - Spatial Machine Learning Engine for planetary analogue site comparison"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
pdf = [
    "reportlab>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
